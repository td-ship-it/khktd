name = "khktd"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Chỉ /api chạy qua Worker; còn lại phục vụ thẳng file tĩnh.
run_worker_first = ["/api", "/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Secrets (KHÔNG ghi vào file này):
#   wrangler secret put GAS_URL   → URL Web App Apps Script (…/exec)
#   wrangler secret put API_KEY   → trùng Script Property API_KEY
