<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điểm danh</title>
<link rel="stylesheet" href="/assets/app.css">
</head><body>
<header class="hero">
  <div class="eyebrow">Điểm danh</div>
  <h1 data-ev="name">Hội nghị Khoa học kỹ thuật Dược lần thứ 43</h1>
</header>
<main class="wrap">
  <section id="formCard" class="card">
    <form id="f" novalidate>
      <label for="phone">Nhập số điện thoại đã đăng ký</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="09xx xxx xxx" required autofocus>
      <div id="err" class="alert err hidden" role="alert"></div>
      <button id="go" class="btn">Điểm danh</button>
    </form>
    <p class="small muted">Chưa đăng ký? Đến bàn hỗ trợ để đăng ký tại chỗ.</p>
  </section>
  <section id="done" class="card center hidden">
    <div class="result ok"><span id="who"></span><small>Điểm danh thành công</small></div>
    <p class="muted">Vui lòng hoàn thành khảo sát ngắn để nhận giấy chứng nhận tham dự.</p>
    <a id="next" class="btn" href="#">Làm khảo sát &amp; nhận chứng nhận</a>
  </section>
</main>
<script src="/assets/app.js"></script>
<script>
  const { $, call, showError, hide, qs } = App;
  App.fillEvent('Điểm danh');
  const code = (qs.get('c') || '').trim();
  if (!code) showError($('#err'), 'Vui lòng quét mã QR chung tại hội trường để điểm danh.');
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); hide($('#err'));
    const btn = $('#go'); btn.disabled = true;
    try {
      const r = await call('checkin_phone', { phone: $('#phone').value, code });
      $('#formCard').classList.add('hidden'); $('#done').classList.remove('hidden');
      $('#who').textContent = r.name;
      const next = '/survey?t=' + encodeURIComponent(r.token);
      $('#next').href = next;
      if (r.surveyDone) { $('#next').textContent = 'Xem giấy chứng nhận'; $('#next').href = '/certificate?t=' + encodeURIComponent(r.token); }
    } catch (e) { showError($('#err'), e.message); }
    finally { btn.disabled = false; }
  });
</script>
</body></html>
